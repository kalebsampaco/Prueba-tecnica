  database:
    container_name: db_api
    restart: unless-stopped
    image: postgres
    environment:
      POSTGRES_DB: admin
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    networks:
      - api-app-network
    ports:
      - 5435:5432
    volumes:
      - ./data:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: always
    networks:
      - api-app-network
    ports:
      - 8085:8080
